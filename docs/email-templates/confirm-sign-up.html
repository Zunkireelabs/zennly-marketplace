<!--
  Supabase Auth → Emails → Templates → "Confirm sign up"
  Project: fninbtezzrzsmszorfgt (zennly-marketplace)

  Paste the markup below (everything after this comment) into the template's Body field.
  Suggested subject: Your Zennly sign-in code

  WHY THIS TEMPLATE MATTERS, and why it was missed: signing in and signing UP are the same action
  in this app — /api/auth/email calls signInWithOtp({ shouldCreateUser: true }), so there is no
  separate signup form. But GoTrue does NOT use one template for both: an address that already has
  an account gets "Magic link or OTP", while a brand-new address gets THIS one. The former was
  switched to {{ .Token }} long ago; this one was still Supabase's default, which sends a
  ConfirmationURL link. So every existing customer got a working 6-digit code and every NEW
  customer got a link, while the login dialog sat waiting for a code they had never been sent.

  That is the third template in this project found sending a link to a UI expecting a code
  (login, then change-email, now sign-up). If a fourth auth email is ever introduced, check its
  template before shipping the flow.

  WHAT CHANGED FROM SUPABASE'S DEFAULT:
    - {{ .ConfirmationURL }} (a clickable link) → {{ .Token }} (a 6-digit code).
      Consistency with the login flow is the lesser reason. The real one: the confirmation link
      carries a PKCE verifier bound to the browser that STARTED the sign-in. Someone who begins on
      a laptop and taps the link on their phone gets an error with no explanation. A code works
      from any device, which is how people actually read email.

  Note {{ .NewEmail }} is NOT available here (that is the change-email template only) — the
  address being confirmed is {{ .Email }}.

  EMAIL-CLIENT CONSTRAINTS this markup respects: table layout (not flexbox/grid), inline styles
  only (no <style> block, which Gmail strips), no web fonts (Outfit won't load — the stack falls
  back to system sans), no external images (nothing to block or fail), and a max-width that
  survives a phone.

  Brand tokens copied from src/app/globals.css — keep in sync if those change:
    background #fefdfb · foreground #23211d · muted-foreground #6b6255
    border #e6e1d6 · card #ffffff · primary #5b6e56 · radius-lg 18px · radius-md 12px
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fefdfb;margin:0;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">

        <!-- Wordmark. Text, not an image: images are blocked by default in most clients, and a
             blocked logo looks broken where a styled word never does. -->
        <tr>
          <td style="padding-bottom:24px;">
            <span style="font-family:Georgia,'Times New Roman',serif;font-size:26px;font-weight:600;color:#5b6e56;letter-spacing:-0.01em;">zennly</span>
          </td>
        </tr>

        <tr>
          <td style="background-color:#ffffff;border:1px solid #e6e1d6;border-radius:18px;padding:32px;">

            <h1 style="margin:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:20px;line-height:1.3;font-weight:600;color:#23211d;">
              Welcome to Zennly
            </h1>

            <p style="margin:0 0 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#6b6255;">
              Enter this code to finish signing in as <strong style="color:#23211d;">{{ .Email }}</strong>.
            </p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="background-color:#f4f6f3;border:1px solid #e6e1d6;border-radius:12px;padding:20px 12px;">
                  <span style="font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:30px;line-height:1;font-weight:600;letter-spacing:8px;color:#23211d;">{{ .Token }}</span>
                </td>
              </tr>
            </table>

            <p style="margin:24px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55;color:#6b6255;">
              Didn&rsquo;t try to sign in? Ignore this email — no account will be created.
            </p>

          </td>
        </tr>

        <tr>
          <td style="padding-top:20px;">
            <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#6b6255;">
              Zennly — a calmer way to discover and book wellness &amp; self-care.
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
