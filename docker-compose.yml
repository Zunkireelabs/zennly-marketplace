services:
  app:
    container_name: zennly-marketplace-app-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_TRACK_EVENTS: ${NEXT_PUBLIC_TRACK_EVENTS}
        NEXT_PUBLIC_BOOK_SPA_ENGINE_URL: ${NEXT_PUBLIC_BOOK_SPA_ENGINE_URL}
        NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY: ${NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY}
        NEXT_PUBLIC_ENGINE_BOOKING: ${NEXT_PUBLIC_ENGINE_BOOKING}
        NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN: ${NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN}
    env_file:
      - .env
    restart: unless-stopped
    mem_limit: 1024m
    networks:
      - hosting
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      # HTTPS router. It still answers on both hosts, but www is sent to the plain domain with a
      # permanent redirect (the -www middleware below), so Google sees one site and not two
      # identical ones. Canonical tags and the sitemap already use https://zennly.io.
      - "traefik.http.routers.zennly-marketplace-app-prod.rule=Host(`zennly.io`) || Host(`www.zennly.io`)"
      - "traefik.http.routers.zennly-marketplace-app-prod.entrypoints=websecure"
      - "traefik.http.routers.zennly-marketplace-app-prod.tls=true"
      - "traefik.http.routers.zennly-marketplace-app-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zennly-marketplace-app-prod.middlewares=zennly-marketplace-app-prod-www"
      # HTTP -> HTTPS redirect. The www rule runs first, so http://www.zennly.io/x reaches
      # https://zennly.io/x in one hop instead of two.
      - "traefik.http.routers.zennly-marketplace-app-prod-http.rule=Host(`zennly.io`) || Host(`www.zennly.io`)"
      - "traefik.http.routers.zennly-marketplace-app-prod-http.entrypoints=web"
      - "traefik.http.routers.zennly-marketplace-app-prod-http.middlewares=zennly-marketplace-app-prod-www,zennly-marketplace-app-prod-redirect"
      - "traefik.http.middlewares.zennly-marketplace-app-prod-redirect.redirectscheme.scheme=https"
      # www -> plain domain, permanent (301), path and query kept. Compose writes a literal dollar as "$$".
      - "traefik.http.middlewares.zennly-marketplace-app-prod-www.redirectregex.regex=^https?://www\\.zennly\\.io/(.*)"
      - "traefik.http.middlewares.zennly-marketplace-app-prod-www.redirectregex.replacement=https://zennly.io/$${1}"
      - "traefik.http.middlewares.zennly-marketplace-app-prod-www.redirectregex.permanent=true"
      # Service port
      - "traefik.http.services.zennly-marketplace-app-prod.loadbalancer.server.port=3000"

networks:
  hosting:
    external: true
