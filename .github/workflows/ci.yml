name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci requires byte-exact lockfile parity; the ubuntu-latest runner's
      # bundled npm resolves maplibre-gl's nested wasm32-wasi optional deps
      # differently than the npm version that generated this lockfile on
      # Windows. npm install tolerates that without changing the lockfile
      # (confirmed elsewhere on this stack via `npm install --dry-run`).
      - run: npm install

      # Scoped to src/ — public/maplibre/*.mjs is a vendored worker file copied
      # from node_modules by postinstall, not app code, and isn't in the
      # project's eslint ignores.
      - run: npx eslint src --max-warnings 0

      # No standalone `tsc --noEmit` here: PageProps<...> (Next 16's typed-routes
      # helper) only exists in .next/dev/types/, generated by `next build` itself
      # (referenced via next-env.d.ts / tsconfig.json's include) - a tsc run
      # before any build sees a clean checkout with no .next/ and fails on a
      # type that hasn't been generated yet. `next build` already type-checks
      # as part of building (no typescript.ignoreBuildErrors set), so this
      # step below is the real type-check too.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://${{ vars.PROD_DOMAIN }}
          NEXT_PUBLIC_TRACK_EVENTS: ${{ vars.PROD_NEXT_PUBLIC_TRACK_EVENTS }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
