name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci requires byte-exact lockfile parity; the ubuntu-latest runner's
      # bundled npm resolves maplibre-gl's nested wasm32-wasi optional deps
      # differently than the npm version that generated this lockfile on
      # Windows. npm install tolerates that without changing the lockfile
      # (confirmed elsewhere on this stack via `npm install --dry-run`).
      - run: npm install

      - run: npx eslint --max-warnings 0

      - run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://${{ vars.PROD_DOMAIN }}
          NEXT_PUBLIC_TRACK_EVENTS: ${{ vars.PROD_NEXT_PUBLIC_TRACK_EVENTS }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
