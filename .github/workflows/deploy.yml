name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # See ci.yml — npm ci fails here for the same npm-version/wasm32-wasi
      # lockfile-resolution mismatch; npm install tolerates it.
      - run: npm install

      # See ci.yml — scoped to src/ to skip the vendored public/maplibre worker file.
      - run: npx eslint src --max-warnings 0

      # See ci.yml - no standalone tsc step; `next build` below generates the
      # types PageProps<...> needs and type-checks as part of building.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.PROD_DOMAIN }}
          NEXT_PUBLIC_TRACK_EVENTS: ${{ vars.PROD_NEXT_PUBLIC_TRACK_EVENTS }}
          NEXT_PUBLIC_BOOK_SPA_ENGINE_URL: ${{ secrets.PROD_NEXT_PUBLIC_BOOK_SPA_ENGINE_URL }}
          NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY }}
          NEXT_PUBLIC_ENGINE_BOOKING: ${{ vars.PROD_NEXT_PUBLIC_ENGINE_BOOKING }}
          NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN: ${{ vars.PROD_NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN }}
          # See ci.yml - no DB vars here either, matching the Dockerfile build
          # on the VPS (DB access is runtime-only, via .env, not a build ARG).

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://${{ vars.PROD_DOMAIN }}
          NEXT_PUBLIC_TRACK_EVENTS: ${{ vars.PROD_NEXT_PUBLIC_TRACK_EVENTS }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_BOOK_SPA_ENGINE_URL: ${{ secrets.PROD_NEXT_PUBLIC_BOOK_SPA_ENGINE_URL }}
          NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY: ${{ secrets.PROD_NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY }}
          NEXT_PUBLIC_ENGINE_BOOKING: ${{ vars.PROD_NEXT_PUBLIC_ENGINE_BOOKING }}
          NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN: ${{ vars.PROD_NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN }}
          BOOK_SPA_FUNCTIONS_URL: ${{ secrets.PROD_BOOK_SPA_FUNCTIONS_URL }}
          BOOK_SPA_MARKETPLACE_SECRET: ${{ secrets.PROD_BOOK_SPA_MARKETPLACE_SECRET }}
          # Marketing "free demo" code flow (/api/otp/*). Server-only, so runtime-only — not a
          # build arg. RESEND_API_KEY can be the SAME key already used for Supabase auth email:
          # Resend verifies a DOMAIN, and zennly.io is already verified there (auth mail sends
          # from it today), so one key covers info@zennly.io too. Until both are set,
          # /api/otp/send answers 500 server-misconfigured rather than silently sending nothing.
          RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
          OTP_SECRET: ${{ secrets.PROD_OTP_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_TRACK_EVENTS,DATABASE_URL,DIRECT_URL,SUPABASE_SERVICE_ROLE_KEY,NEXT_PUBLIC_BOOK_SPA_ENGINE_URL,NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY,NEXT_PUBLIC_ENGINE_BOOKING,NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN,BOOK_SPA_FUNCTIONS_URL,BOOK_SPA_MARKETPLACE_SECRET
          script: |
            set -e
            REPO="${{ github.event.repository.name }}"
            DIR="/home/zunkireelabs/devprojects/${REPO}-app-prod"

            # First-push bootstrap: create directory and clone if missing
            if [ ! -d "$DIR" ]; then
              echo "First deployment — bootstrapping $DIR"
              mkdir -p "$DIR"
              git clone -b main git@github.com:${{ github.repository }}.git "$DIR"
            fi

            cd "$DIR"
            git fetch origin
            git checkout main
            git pull origin main

            # Runtime .env (overwritten each deploy) — holds both the build-arg
            # values (needed again here since the image builds on this box) and
            # the server-only DB/Supabase secrets the app reads at runtime.
            cat > .env << ENVEOF
            NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_TRACK_EVENTS=$NEXT_PUBLIC_TRACK_EVENTS
            DATABASE_URL=$DATABASE_URL
            DIRECT_URL=$DIRECT_URL
            SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
            NEXT_PUBLIC_BOOK_SPA_ENGINE_URL=$NEXT_PUBLIC_BOOK_SPA_ENGINE_URL
            NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY=$NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY
            NEXT_PUBLIC_ENGINE_BOOKING=$NEXT_PUBLIC_ENGINE_BOOKING
            NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN=$NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN
            BOOK_SPA_FUNCTIONS_URL=$BOOK_SPA_FUNCTIONS_URL
            BOOK_SPA_MARKETPLACE_SECRET=$BOOK_SPA_MARKETPLACE_SECRET
            RESEND_API_KEY=$RESEND_API_KEY
            OTP_SECRET=$OTP_SECRET
            ENVEOF
            chmod 600 .env

            # Build the runtime image first (cached layers are shared with the
            # migrator build below, since both come from the same Dockerfile).
            docker compose build app

            # Migrations run against the `builder` stage, NOT the runtime
            # image `docker compose build` just produced: the standalone
            # runtime output deliberately excludes dev-only CLI packages
            # (prisma) and the schema/migrations directory itself, since the
            # running server never imports them. `npx prisma` against that
            # image finds nothing installed and silently fetches the latest
            # major version from the registry instead of this project's
            # pinned ^7.10.0 - broke a deploy with
            # "`prisma migrate deploy` is a Prisma 7 command and is not
            # available in Prisma 8". `builder` already has the full
            # devDependencies, the right CLI version, and the schema.
            docker build --target builder \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
              --build-arg NEXT_PUBLIC_TRACK_EVENTS="$NEXT_PUBLIC_TRACK_EVENTS" \
              --build-arg NEXT_PUBLIC_BOOK_SPA_ENGINE_URL="$NEXT_PUBLIC_BOOK_SPA_ENGINE_URL" \
              --build-arg NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY="$NEXT_PUBLIC_BOOK_SPA_ENGINE_ANON_KEY" \
              --build-arg NEXT_PUBLIC_ENGINE_BOOKING="$NEXT_PUBLIC_ENGINE_BOOKING" \
              --build-arg NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN="$NEXT_PUBLIC_BOOKING_ENGINE_ORIGIN" \
              -t zennly-marketplace-migrate:latest .
            docker run --rm --env-file .env zennly-marketplace-migrate:latest npx prisma migrate deploy
            docker rmi zennly-marketplace-migrate:latest || true

            # Migrations succeeded - now swap in the actual runtime container.
            docker compose up -d

            echo "Waiting for container to be healthy..."
            sleep 10
            CONTAINER="${REPO}-app-prod"
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs "$CONTAINER" --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.PROD_DOMAIN }}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Production health check passed (HTTP $HTTP_CODE)"
          else
            echo "Production health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
